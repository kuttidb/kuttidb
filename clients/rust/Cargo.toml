[package]
name = "kuttidb"
version = "0.0.6-beta"
edition = "2021"
description = "Full KuttiDB v1.8 binary protocol client with cache, queues, exchanges, atomic operations, single-flight, SWR, streams, and managed lifecycle"
license = "Apache-2.0"
repository = "https://github.com/kuttidb/kuttidb"
homepage = "https://github.com/kuttidb/kuttidb"
keywords = ["database", "key-value", "queue", "stream", "embedded"]

[lib]
name = "kuttidb"
path = "src/lib.rs"

[[bin]]
name = "smoketest"
path = "src/main.rs"

[[bin]]
name = "bench"
path = "src/bench.rs"

[dependencies]
rustls = "0.23"
webpki-roots = "1"
