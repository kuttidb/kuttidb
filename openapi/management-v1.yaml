    RouteDeclare: { type: object, required: [queue_id, routing_key], properties: { queue_id: { type: string, pattern: '^b64u:[A-Za-z0-9_-]+$' }, routing_key: { type: string, maxLength: 255 } } }
    RoutedBody: { type: object, required: [routing_key, body], properties: { routing_key: { type: string, maxLength: 255 }, body: { type: string, description: Canonical padded Base64 data }, ttl_ms: { type: integer, minimum: 0 } } }
    DefaultRoutedBody: { type: object, required: [queue_id, body], properties: { queue_id: { type: string, pattern: '^b64u:[A-Za-z0-9_-]+$' }, body: { type: string, description: Canonical padded Base64 data }, ttl_ms: { type: integer, minimum: 0 } } }
    StreamDeclare: { type: object, required: [name, partitions], properties: { name: { type: string }, partitions: { type: integer, minimum: 1, maximum: 256 }, max_retained_bytes: { type: integer, minimum: 0 }, max_retained_age_ms: { type: integer, minimum: 0 } } }
    Nack: { type: object, properties: { requeue: { type: boolean, default: true }, delay_ms: { type: integer, minimum: 0, maximum: 60000 } } }
