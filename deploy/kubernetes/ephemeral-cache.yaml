apiVersion: apps/v1
kind: Deployment
metadata:
  name: kuttidb-cache
  labels:
    app.kubernetes.io/name: kuttidb
    app.kubernetes.io/component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kuttidb
      app.kubernetes.io/component: cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kuttidb
        app.kubernetes.io/component: cache
    spec:
      containers:
        - name: kuttidb
          image: kuttidb:local
          imagePullPolicy: IfNotPresent
          args: ["7379", "-", "100", "-", "64"]
          ports:
            - name: client
              containerPort: 7379
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: "1", memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
          readinessProbe:
            tcpSocket: {port: client}
            initialDelaySeconds: 1
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: client}
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kuttidb-cache
spec:
  selector:
    app.kubernetes.io/name: kuttidb
    app.kubernetes.io/component: cache
  ports:
    - name: client
      port: 7379
      targetPort: client
