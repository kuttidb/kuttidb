# Publishes the Java client to Maven Central when a java-v* tag is pushed.
#
# Auth secrets (never stored in the repo):
# - MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD: Central Portal user token,
#   mapped to the `central` server id of a runner-local settings.xml.
# - GPG_PRIVATE_KEY (armored) / GPG_PASSPHRASE: artifact signing key, mapped to
#   the `gpg.passphrase` server id that maven-gpg-plugin reads by default.
# See docs/operations/CLIENT_PUBLISHING.md.
name: Release Java client (Maven Central)

on:
  push:
    tags: ['java-v*']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-java
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gate: build the server and run the full native protocol smoke plus the
      # managed lifecycle smokes against it, mirroring the Makefile targets.
      - name: Protocol gate
        run: |
          make kuttidb
          tmp=$(mktemp -d)
          ./kuttidb 7394 "$tmp/k.wal" 100 --queue-wal "$tmp/q.wal" 2>/dev/null & pid=$!
          trap 'kill $pid 2>/dev/null || true; rm -rf "$tmp"' EXIT
          sleep 1
          cd clients/java
          mkdir -p target/classes target/test-classes
          javac -encoding UTF-8 -d target/classes $(find src/main/java -name '*.java')
          javac -encoding UTF-8 -cp target/classes -d target/test-classes Smoke.java ManagedSmoke.java
          java -cp target/classes:target/test-classes Smoke
          java -cp target/classes:target/test-classes ManagedSmoke "$(mktemp -d)" "$PWD/../../kuttidb"
          java -cp target/classes:target/test-classes ManagedSmoke "$(mktemp -d)" "$PWD/../../kuttidb" tcp

      - name: Import GPG signing key
        run: echo "$GPG_PRIVATE_KEY" | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      # settings.xml is generated on the runner and never committed. Secrets
      # reach it through the environment, which GitHub masks in logs.
      - name: Write runner-local Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>central</id>
                <username>${env.MAVEN_CENTRAL_USERNAME}</username>
                <password>${env.MAVEN_CENTRAL_PASSWORD}</password>
              </server>
              <server>
                <id>gpg.passphrase</id>
                <passphrase>${env.GPG_PASSPHRASE}</passphrase>
              </server>
            </servers>
          </settings>
          EOF
          # maven-gpg-plugin routes the gpg.passphrase server through Maven's
          # security dispatcher, which insists on a master-password file even
          # when the server value is plain text. Generate a throwaway one.
          MASTER=$(mvn --encrypt-master-password "kuttidb-runner-$(date +%s)" | grep -o '{[^}]*}')
          printf '<settingsSecurity>\n  <master>%s</master>\n</settingsSecurity>\n' "$MASTER" \
            > ~/.m2/settings-security.xml
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Publish to Maven Central
        working-directory: clients/java
        run: mvn -B --no-transfer-progress clean deploy
