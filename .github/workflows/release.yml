# Builds and publishes the official KuttiDB binaries.
#
# Trigger: push a v* tag (v0.0.2, v0.1.0-beta.1, ...) to publish a release, or
# run via workflow_dispatch for a dry run — the identical pipeline runs, but
# artifacts are only attached to the workflow run and no GitHub Release is
# created.
#
# Each platform job builds BOTH variants from the same source:
#
#   - telemetry-free (default): the reporter is not compiled in — even
#     `--telemetry on` cannot report. Tarball keeps the plain asset name
#     `kuttidb-<version>-<os>-<arch>.tar.gz` so existing scripts keep
#     receiving telemetry-not-included binaries.
#   - telemetry-capable: `-DKUTTIDB_TELEMETRY=ON` (curl + OpenSSL reporter).
#     Tarball: `kuttidb-<version>-telemetry-<os>-<arch>.tar.gz`.
#
# The full ctest suite runs once as a release gate on the telemetry-free
# build; the telemetry build gets the telemetry configuration test plus a
# `--features` check. Gates: TLS (OpenSSL) really linked, `telemetry=off` /
# `telemetry=v1` reported by the matching binary. The release job aggregates
# per-tarball checksums into SHASUMS256.txt and publishes the GitHub Release
# (marked prerelease when the tag contains a hyphen, e.g. v0.0.2-beta).
#
# Process doc: docs/operations/RELEASE.md
name: Release official binaries

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds pin the oldest supported runner image on purpose:
          # binaries inherit that image's glibc, so building on 22.04 keeps
          # the runtime floor at glibc 2.35 / OpenSSL 3 (Ubuntu 22.04+,
          # Debian 12+, RHEL 9+).
          - os: linux
            arch: x86_64
            runner: ubuntu-22.04
            embed: libkuttidb_embed.so
          - os: linux
            arch: arm64
            runner: ubuntu-22.04-arm
            embed: libkuttidb_embed.so
          # macOS deployment target 12.0 keeps the binaries runnable on
          # Monterey and newer (Intel) / Big Sur and newer (Apple silicon).
          - os: macos
            arch: x86_64
            runner: macos-15-intel
            embed: libkuttidb_embed.dylib
          - os: macos
            arch: arm64
            runner: macos-15
            embed: libkuttidb_embed.dylib
    env:
      EMBED_LIB: ${{ matrix.embed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install OpenSSL and libcurl headers
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -y
            # libssl-dev: TLS; libcurl4-openssl-dev: telemetry reporter
            sudo apt-get install -y --no-install-recommends libssl-dev libcurl4-openssl-dev
          else
            BREW_OPENSSL="$(brew --prefix openssl@3 2>/dev/null || true)"
            if [ -z "$BREW_OPENSSL" ] || [ ! -d "$BREW_OPENSSL" ]; then
              brew install openssl@3
            fi
            echo "OPENSSL_ROOT=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          fi

      - name: Derive release version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building version: $VERSION"

      - name: Configure and build both variants (Release)
        run: |
          PLATFORM_ARGS=""
          if [ "$RUNNER_OS" = macOS ]; then
            # Be explicit: FindOpenSSL must never silently miss Homebrew's
            # keg-only openssl@3 — the TLS check below would catch it, but
            # failing at configure time is a clearer error.
            PLATFORM_ARGS="-DOPENSSL_ROOT_DIR=$OPENSSL_ROOT -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0"
          fi
          JOBS="$(nproc 2>/dev/null || sysctl -n hw.ncpu)"
          # Variant 1 — telemetry-free (the plain asset name; the reporter is
          # not compiled in, so it can never report).
          cmake -S . -B build-release \
            -DCMAKE_BUILD_TYPE=Release \
            -DKUTTIDB_TLS=ON \
            $PLATFORM_ARGS
          cmake --build build-release -j"$JOBS"
          # Variant 2 — telemetry-capable, the build the installer ships when
          # a user accepts the community opt-in: reporting is ON by default
          # (DO_NOT_TRACK=1 or --telemetry off always disable it).
          cmake -S . -B build-telemetry \
            -DCMAKE_BUILD_TYPE=Release \
            -DKUTTIDB_TLS=ON \
            -DKUTTIDB_TELEMETRY=ON \
            -DKUTTIDB_TELEMETRY_DEFAULT_ON=ON \
            $PLATFORM_ARGS
          cmake --build build-telemetry -j"$JOBS"

      - name: Test gate (ctest, telemetry-free build)
        run: ctest --test-dir build-release --output-on-failure

      - name: Telemetry build gate (reporter configuration)
        # Full source is identical; the telemetry delta is one compile
        # definition, so the focused configuration test plus the --features
        # check below cover the variant.
        run: ctest --test-dir build-telemetry -R telemetry --output-on-failure

      - name: Verify TLS is linked
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            ldd build-release/kuttidb | grep -q libssl
          else
            otool -L build-release/kuttidb | grep -q libssl
          fi
          echo "OpenSSL is linked into kuttidb (TLS available)"

      - name: Verify build feature flags
        run: |
          ./build-release/kuttidb --features | grep -qx 'telemetry=off' \
            || { echo "telemetry-free build must report telemetry=off"; exit 1; }
          FEAT_T="$(./build-telemetry/kuttidb --features)"
          printf '%s\n' "$FEAT_T" | grep -qx 'telemetry=v1' \
            || { echo "telemetry build must report telemetry=v1"; exit 1; }
          printf '%s\n' "$FEAT_T" | grep -qx 'telemetry-default=on' \
            || { echo "telemetry build must default to reporting on"; exit 1; }
          echo "telemetry-free reports telemetry=off; telemetry build reports telemetry=v1 and telemetry-default=on"

      - name: Package
        run: |
          PKG_PLAIN="kuttidb-${VERSION}-${{ matrix.os }}-${{ matrix.arch }}"
          PKG_TELE="kuttidb-${VERSION}-telemetry-${{ matrix.os }}-${{ matrix.arch }}"
          # Shared artifacts come from the telemetry-free build; only the
          # kuttidb server differs between the two variants.
          for PKG in "$PKG_PLAIN" "$PKG_TELE"; do
            mkdir -p "dist/${PKG}"
            cp -p "build-release/kuttidb-bench" "dist/${PKG}/"
            cp -p "build-release/${EMBED_LIB}" "dist/${PKG}/"
            cp -p kuttidb-cli README.md LICENSE "dist/${PKG}/"
          done
          cp -p build-release/kuttidb "dist/${PKG_PLAIN}/kuttidb"
          cp -p build-telemetry/kuttidb "dist/${PKG_TELE}/kuttidb"
          tar -czf "dist/${PKG_PLAIN}.tar.gz" -C dist "${PKG_PLAIN}"
          tar -czf "dist/${PKG_TELE}.tar.gz" -C dist "${PKG_TELE}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "dist/${PKG_PLAIN}.tar.gz" "dist/${PKG_TELE}.tar.gz"
          else
            shasum -a 256 "dist/${PKG_PLAIN}.tar.gz" "dist/${PKG_TELE}.tar.gz"
          fi
          ls -la dist

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Collect built tarballs
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Aggregate checksums
        run: |
          cd dist
          sha256sum -- *.tar.gz > SHASUMS256.txt
          echo "--- SHASUMS256.txt ---"
          cat SHASUMS256.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHASUMS256.txt
          body: |
            Official binaries for KuttiDB ${{ github.ref_name }}.

            Install in one line (macOS arm64/x86_64, Linux x86_64/arm64):
            `curl -fsSL https://kuttidb.com/install.sh | bash`

            The installer asks whether you want to opt in to community
            telemetry: **no** (the default) installs the telemetry-free
            build, **yes** installs the telemetry-capable build
            (`kuttidb-<version>-telemetry-<os>-<arch>.tar.gz`) whose servers
            report by default — one delayed, best-effort report per day.
            Turn it off anytime with `DO_NOT_TRACK=1` or `--telemetry off`.
            Details: https://kuttidb.com/telemetry

            Verify a download: `sha256sum -c SHASUMS256.txt`

            Platform notes: the Linux builds need glibc 2.35+ and OpenSSL 3
            (Ubuntu 22.04+, Debian 12+, RHEL 9+); the macOS builds target
            macOS 12+. Each tarball contains the `kuttidb` server,
            `kuttidb-bench`, the embedded library (`libkuttidb_embed.so` /
            `.dylib`), and the `kuttidb-cli` client.

            Docs: [Getting started](https://github.com/kuttidb/kuttidb/blob/main/docs/guides/GETTING_STARTED.md)
            · [Deployment](https://github.com/kuttidb/kuttidb/blob/main/docs/operations/DEPLOYMENT.md)
            · [Release process](https://github.com/kuttidb/kuttidb/blob/main/docs/operations/RELEASE.md)
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
